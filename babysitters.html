<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babysitter Directory</title>
<style>
  :root{
    --bg:#F6F5F1; --panel:#FFFFFF; --ink:#20302B; --muted:#5B6B65;
    --accent:#3E6259; --accent-soft:#E4ECE8; --border:#DCE2DE;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161C1A; --panel:#1F2724; --ink:#EDF1EF; --muted:#9BABA4;
      --accent:#7FB8A6; --accent-soft:#233531; --border:#2C3733;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161C1A; --panel:#1F2724; --ink:#EDF1EF; --muted:#9BABA4;
    --accent:#7FB8A6; --accent-soft:#233531; --border:#2C3733;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
  header{margin-bottom:2rem;}
  h1{font-size:1.6rem;margin:0 0 .3rem;letter-spacing:-0.01em;}
  header p{color:var(--muted);margin:0;font-size:.95rem;}

  form{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:1.25rem;margin-bottom:2rem;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .grid .full{grid-column:1/-1;}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.25rem;}
  input{
    width:100%;padding:.5rem .6rem;border:1px solid var(--border);border-radius:6px;
    background:transparent;color:var(--ink);font-size:.9rem;
  }
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{
    margin-top:1rem;background:var(--accent);color:#fff;border:none;border-radius:6px;
    padding:.6rem 1.1rem;font-size:.9rem;cursor:pointer;
  }
  button:hover{opacity:.9;}

  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:1rem 1.25rem;margin-bottom:.75rem;
    display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;
  }
  .name{font-weight:600;font-size:1.05rem;margin:0 0 .4rem;}
  .details{display:flex;flex-wrap:wrap;gap:.4rem .9rem;color:var(--muted);font-size:.85rem;margin:0;padding:0;list-style:none;}
  .remove{
    background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:6px;padding:.3rem .6rem;font-size:.75rem;margin:0;
  }
  .remove:hover{border-color:#b55;color:#b55;}
  .empty{color:var(--muted);font-size:.9rem;padding:1rem 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Babysitter Directory</h1>
    <p>Data is kept only in this browser tab and clears on reload.</p>
  </header>

  <form id="addForm">
    <div class="grid">
      <div><label for="fname">First name</label><input id="fname" required></div>
      <div><label for="lname">Last name</label><input id="lname" required></div>
      <div><label for="age">Age</label><input id="age" type="number" min="16" max="99" required></div>
      <div><label for="exp">Years of experience</label><input id="exp" type="number" min="0" max="60" required></div>
      <div><label for="cert">Certifications</label><input id="cert" placeholder="CPR, First Aid"></div>
      <div><label for="rate">Hourly rate</label><input id="rate" placeholder="e.g. €12/hr"></div>
      <div class="full"><label for="avail">Availability</label><input id="avail" placeholder="e.g. Weekday evenings"></div>
    </div>
    <button type="submit">Add babysitter</button>
  </form>

  <div id="list"></div>
</div>

<script>
  // In-memory only — no localStorage, no backend.
  let babysitters = [
    { fname:"Emma", lname:"Verstraete", age:22, exp:4, cert:"CPR, First Aid", rate:"€11/hr", avail:"Weekends" },
    { fname:"Lars", lname:"Peeters", age:27, exp:6, cert:"CPR", rate:"€13/hr", avail:"Weekday evenings" }
  ];

  const listEl = document.getElementById("list");
  const form = document.getElementById("addForm");

  function render(){
    listEl.innerHTML = "";
    if(babysitters.length === 0){
      listEl.innerHTML = '<p class="empty">No babysitters added yet.</p>';
      return;
    }
    babysitters.forEach((b, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <p class="name">${escapeHtml(b.fname)} ${escapeHtml(b.lname)}</p>
          <ul class="details">
            <li>Age ${escapeHtml(String(b.age))}</li>
            <li>${escapeHtml(String(b.exp))} yrs experience</li>
            ${b.cert ? `<li>${escapeHtml(b.cert)}</li>` : ""}
            ${b.rate ? `<li>${escapeHtml(b.rate)}</li>` : ""}
            ${b.avail ? `<li>${escapeHtml(b.avail)}</li>` : ""}
          </ul>
        </div>
        <button class="remove" data-i="${i}">Remove</button>
      `;
      listEl.appendChild(card);
    });
    listEl.querySelectorAll(".remove").forEach(btn=>{
      btn.addEventListener("click", () => {
        babysitters.splice(Number(btn.dataset.i), 1);
        render();
      });
    });
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    babysitters.push({
      fname: document.getElementById("fname").value.trim(),
      lname: document.getElementById("lname").value.trim(),
      age: document.getElementById("age").value,
      exp: document.getElementById("exp").value,
      cert: document.getElementById("cert").value.trim(),
      rate: document.getElementById("rate").value.trim(),
      avail: document.getElementById("avail").value.trim()
    });
    form.reset();
    render();
  });

  render();
</script>
</body>
</html>
